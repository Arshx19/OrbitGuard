[project]
name = "orbitguard-ai"
version = "1.0.0"
description = "Explainable AI-Assisted Space Debris Collision Detection & Avoidance Decision System"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sgp4>=2.23,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "requests>=2.31",
    "httpx>=0.27"
]

[tool.vercel]
entrypoint = "src/app/main.py"
